<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venue Booking - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-cover bg-center h-screen flex items-center justify-center" style="background-image: url('https://static.dezeen.com/uploads/2025/12/ecore-penn-state-university-payette_dezeen_2364_sq-1-411x411.jpg');">
    
    <!-- Dark overlay to make the background subtle -->
    <div class="absolute inset-0 bg-slate-900/60"></div>

    <!-- Translucent Frosted Glass Login Card -->
    <div class="relative z-10 bg-white/10 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-96 border border-white/20 text-white">
        <h2 class="text-3xl font-extrabold tracking-tight mb-1">Welcome Back</h2>
        <p class="text-slate-200 text-sm mb-6">Log in to book your campus venues</p>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-200 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-2.5 bg-white/20 border border-white/30 rounded-lg text-white placeholder-slate-300 focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-200 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2.5 bg-white/20 border border-white/30 rounded-lg text-white placeholder-slate-300 focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-lg font-semibold transition shadow-lg shadow-blue-600/30">
                Sign In
            </button>
        </form>
    </div>

</body>
</html>
