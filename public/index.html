<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Venue Portal - Login & Register</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="relative h-screen w-screen flex items-center justify-center overflow-hidden font-sans">
    
    <!-- High-Definition Crisp Campus Background Image -->
    <div class="absolute inset-0 bg-cover bg-center scale-105 filter brightness-90" style="background-image: url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=2000&auto=format&fit=crop');"></div>

    <!-- Soft lighting overlay -->
    <div class="absolute inset-0 bg-gradient-to-tr from-slate-950/70 via-slate-900/40 to-transparent"></div>

    <!-- Ultra-Slick Frosted Glass Card -->
    <div class="relative z-10 bg-slate-900/40 backdrop-blur-xl p-10 rounded-3xl shadow-2xl w-[440px] border border-white/20 text-white transition-all duration-300">
        
        <div class="mb-6">
            <span class="px-3 py-1 text-xs font-semibold bg-blue-500/30 border border-blue-400/30 text-blue-300 rounded-full uppercase tracking-wider">Secure Portal</span>
            <h2 class="text-3xl font-extrabold tracking-tight mt-3 text-white">Venue Booking</h2>
            <p class="text-slate-300 text-sm mt-1">Select your role and action to proceed</p>
        </div>
        
        <!-- Main Form Container -->
        <form id="authForm" class="space-y-5">
            
            <!-- Step 1: Role Dropdown -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Select Role</label>
                <select id="roleSelect" class="w-full px-4 py-3 bg-slate-800/80 border border-white/20 rounded-xl text-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition cursor-pointer">
                    <option value="" disabled selected>-- Choose your role --</option>
                    <option value="student">Student</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>

            <!-- Step 2: Mode Selector (Login vs Register) - Hidden initially -->
            <div id="modeSection" class="hidden opacity-0 transition-all duration-300 space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">I want to</label>
                    <div class="grid grid-cols-2 gap-3 bg-slate-800/60 p-1.5 rounded-xl border border-white/10">
                        <button type="button" id="loginTabBtn" class="py-2.5 rounded-lg text-sm font-bold bg-blue-600 text-white transition shadow-md">Sign In</button>
                        <button type="button" id="registerTabBtn" class="py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white transition">Register</button>
                    </div>
                </div>

                <!-- DYNAMIC FIELDS CONTAINER -->
                <div id="dynamicFields" class="space-y-4 pt-2">
                    <!-- Fields will be injected via JavaScript depending on Login or Register mode -->
                </div>
            </div>

        </form>
    </div>

    <!-- Interactive Logic Script -->
    <script>
        const roleSelect = document.getElementById('roleSelect');
        const modeSection = document.getElementById('modeSection');
        const loginTabBtn = document.getElementById('loginTabBtn');
        const registerTabBtn = document.getElementById('registerTabBtn');
        const dynamicFields = document.getElementById('dynamicFields');

        let currentMode = 'login'; // default mode when role is picked

        // Step 1: When role is selected, reveal the Login/Register mode selector
        roleSelect.addEventListener('change', () => {
            modeSection.classList.remove('hidden');
            setTimeout(() => modeSection.classList.remove('opacity-0'), 10);
            renderFields();
        });

        // Step 2: Toggle Tabs
        loginTabBtn.addEventListener('click', () => {
            currentMode = 'login';
            loginTabBtn.className = "py-2.5 rounded-lg text-sm font-bold bg-blue-600 text-white transition shadow-md";
            registerTabBtn.className = "py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white transition";
            renderFields();
        });

        registerTabBtn.addEventListener('click', () => {
            currentMode = 'register';
            registerTabBtn.className = "py-2.5 rounded-lg text-sm font-bold bg-blue-600 text-white transition shadow-md";
            loginTabBtn.className = "py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white transition";
            renderFields();
        });

        // Step 3: Render corresponding input fields dynamically
        function renderFields() {
            if (currentMode === 'login') {
                dynamicFields.innerHTML = `
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Username</label>
                        <input type="text" id="username" required placeholder="Enter your username" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-slate-400 focus:bg-white/15 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Password</label>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-slate-400 focus:bg-white/15 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    </div>
                    <button type="submit" class="w-full mt-2 bg-blue-600 hover:bg-blue-500 text-white py-3.5 rounded-xl font-bold tracking-wide transition shadow-lg shadow-blue-600/40 active:scale-[0.98]">
                        Sign In
                    </button>
                `;
            } else {
                dynamicFields.innerHTML = `
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Set Username</label>
                        <input type="text" id="username" required placeholder="Choose a username" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-slate-400 focus:bg-white/15 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Set Password</label>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-slate-400 focus:bg-white/15 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Confirm Password</label>
                        <input type="password" id="confirmPassword" required placeholder="••••••••" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-slate-400 focus:bg-white/15 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    </div>
                    <button type="submit" class="w-full mt-2 bg-emerald-600 hover:bg-emerald-500 text-white py-3.5 rounded-xl font-bold tracking-wide transition shadow-lg shadow-emerald-600/40 active:scale-[0.98]">
                        Create Account
                    </button>
                `;
            }
        }

        // Form Submission Handler
        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const role = roleSelect.value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (currentMode === 'register') {
                const confirmPassword = document.getElementById('confirmPassword').value;
                if (password !== confirmPassword) {
                    alert('Passwords do not match!');
                    return;
                }
                alert(`Registering new ${role}: ${username}`);
            } else {
                alert(`Logging in ${role}: ${username}`);
            }
        });
    </script>
</body>
</html>
